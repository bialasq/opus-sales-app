name: CI

on:
  push:
    branches: [main, develop, production-hardening]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Realny Postgres, żeby testy izolacji multi-tenant faktycznie się wykonały
    # (bez bazy graceful-skipują — regresje tenantów mogłyby przejść niezauważone).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opus
          POSTGRES_PASSWORD: opus
          POSTGRES_DB: opus_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U opus -d opus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://opus:opus@localhost:5432/opus_test?schema=public
      API_KEY: test-api-key-32-chars-long-string-aaaaaa
      JWT_SECRET: test-jwt-secret-32-chars-minimum-for-ci-aaaa
      ANTHROPIC_API_KEY: test-mock-key
      OPENAI_API_KEY: test-mock-key
      AI_BUDGET_USD_PER_DAY: "100"
      AI_REQUEST_TIMEOUT_MS: "5000"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations (test DB)
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Coverage backend (informational)
        working-directory: backend
        continue-on-error: true
        run: npm run test:coverage

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Security audit (backend, prod deps)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Security audit (frontend, prod deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
