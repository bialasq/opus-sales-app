name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Test backend
        working-directory: backend
        run: npm test
        env:
          API_KEY: test-api-key-32-chars-long-string-aaaaaa
          JWT_SECRET: test-jwt-secret-32-chars-minimum-for-ci-aaaa
          ANTHROPIC_API_KEY: test-mock-key
          OPENAI_API_KEY: test-mock-key
          AI_BUDGET_USD_PER_DAY: "100"
          AI_REQUEST_TIMEOUT_MS: "5000"

      - name: Coverage backend (informational)
        working-directory: backend
        continue-on-error: true
        run: npm run test:coverage
        env:
          API_KEY: test-api-key-32-chars-long-string-aaaaaa
          JWT_SECRET: test-jwt-secret-32-chars-minimum-for-ci-aaaa
          ANTHROPIC_API_KEY: test-mock-key
          OPENAI_API_KEY: test-mock-key
          AI_BUDGET_USD_PER_DAY: "100"
          AI_REQUEST_TIMEOUT_MS: "5000"

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Security audit (backend, prod deps)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Security audit (frontend, prod deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
