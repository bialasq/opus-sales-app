services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/logs/traces:/app/logs/traces
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      # Puste = względne /api w przeglądarce; proxy Vite kieruje na backend
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
