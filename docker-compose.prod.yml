services:
  # PostgreSQL — źródło prawdy dla kont, organizacji, plików i jobów.
  # Domyślnie uruchamiany w compose. Aby użyć ZEWNĘTRZNEJ bazy (RDS/Neon/Supabase):
  #   1. ustaw DATABASE_URL w pliku .env obok tego compose (wskazując zewnętrzny host),
  #   2. nie startuj tego serwisu: docker compose -f docker-compose.prod.yml up <pozostałe usługi>
  #      lub usuń `postgres` z `depends_on` backendu.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env (nie zostawiaj domyślnego)}
      POSTGRES_DB: ${POSTGRES_DB:-opus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opus} -d ${POSTGRES_DB:-opus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Domyślnie obraz lokalny (build na maszynie). CD ustawia BACKEND_IMAGE na obraz z GHCR,
    # po czym `docker compose pull` pobiera go zamiast budować.
    image: ${BACKEND_IMAGE:-opus-sales-app-backend:latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      REDIS_URL: redis://redis:6379
      # DATABASE_URL nadpisuje wartość z backend/.env. Domyślnie wskazuje na
      # serwis `postgres` w tej sieci. Dla zewnętrznej bazy ustaw DATABASE_URL w .env (obok compose).
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-opus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-opus}?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # OPCJONALNE object storage. Backend używa go TYLKO gdy w backend/.env ustawisz
  # S3_BUCKET + S3_ENDPOINT (np. http://minio:9000) + S3_ACCESS_KEY_ID/SECRET.
  # Bez tego backend zapisuje pliki na lokalny wolumen (backend_uploads) i ten
  # serwis jest zbędny — usuń go lub nie startuj, jeśli nie skalujesz horyzontalnie.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Wymagane sekrety — brak domyślnych. Ustaw w .env obok compose.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Ustaw MINIO_ROOT_USER w .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Ustaw MINIO_ROOT_PASSWORD w .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${FRONTEND_IMAGE:-opus-sales-app-frontend:latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
  backend_logs:
  redis_data:
  minio_data:
  postgres_data:
